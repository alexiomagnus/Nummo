<!doctype html>
<html lang="it">
  <head>

    <meta name="description" content="Nummo: inserimento rapido delle spese personali." />
    <!-- Prima del bundle: colori di `background` dello schema Menta (tokens.ts). A runtime GlobalStyle li sostituisce con un solo tag che segue il tema scelto. -->
    <meta name="theme-color" content="#F5FBF5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1511" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Nummo</title>
    <style id="expo-reset">
      html, body { height: 100%; }
      body { overflow: hidden; margin: 0; }
      #root { display: flex; height: 100%; flex: 1; }
    </style>
  </head>
  <body>
    <noscript>Abilita JavaScript per utilizzare Nummo.</noscript>
    <div id="root"></div>
  </body>
</html>
